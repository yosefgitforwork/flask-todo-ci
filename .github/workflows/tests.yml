name: Run Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create .env files for CI
        run: |
          cp backend/.env.example backend/.env
          cp backend/.env.example .env

      - name: Start MySQL First
        run: docker compose up -d todo-mysql

      - name: Wait for MySQL to boot
        run: sleep 20

      - name: Build and Start All Services
        run: docker compose up -d --build --no-deps backend frontend

      - name: Run Tests inside Backend Container
        run: |
          docker compose exec -T backend pytest

      - name: Shut down Docker services
        if: always()
        run: docker compose down