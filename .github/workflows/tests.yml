name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. הרצת ה-Tests
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: flask_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --upgrade "Flask>=2.3.0" "Werkzeug>=2.3.0" "Jinja2>=3.1.0" "Flask-SQLAlchemy>=3.0.0" pytest pytest-flask pymysql

      - name: Create temporary .env for CI
        run: |
          echo "DB_HOST=127.0.0.1" > .env
          echo "MYSQL_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_USER=root" >> .env
          echo "DB_PASSWORD=rootpassword" >> .env
          echo "DB_NAME=flask_test" >> .env
          echo "DATABASE_URL=mysql+pymysql://root:rootpassword@127.0.0.1:3306/flask_test" >> .env
          cp .env backend/.env || true

      - name: Run Pytest
        env:
          PYTHONPATH: .
          DB_HOST: 127.0.0.1
          MYSQL_HOST: 127.0.0.1
          DATABASE_URL: mysql+pymysql://root:rootpassword@127.0.0.1:3306/flask_test
        run: |
          pytest test_server.py

  # 2. בנייה ודחיפה ל-Docker Hub (רץ רק אם ה-tests הצליחו!)
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-backend:${{ github.sha }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-frontend:${{ github.sha }}