# Three fully separate services that talk only over the compose network.
#
#   frontend (nginx) --HTTP--> backend (gunicorn/Flask) --SQL--> mysql
#        :8080                        :5000                       :3306
#
# First run only: create/adopt the schema with Flask-Migrate — see the README's
# "Database migrations" section (`docker compose exec backend flask db upgrade`
# on a fresh DB, or `flask db stamp head` on the existing one).

services:
  mysql:
    image: mysql:8.0
    container_name: todo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: flask     # keep the EXISTING database name — no rename
      MYSQL_USER: flask
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      # Reuse the existing named volume so current data is preserved.
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      # משתמשים ב-MYSQL_ROOT_PASSWORD משתנה הסביבה ולא בסיסמה קשיחה
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    container_name: todo-backend
    restart: unless-stopped
    environment:
      FLASK_CONFIG: ${FLASK_CONFIG}
      FLASK_APP: wsgi.py         # lets `flask db ...` find the app in this container
      DB_HOST: mysql
      DB_NAME: flask
      DB_USER: flask
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5001:5000"

  frontend:
    build: ./frontend
    container_name: todo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  # Optional integration smoke test (used by CI). Runs only with the "test"
  # profile or via `docker compose run --rm testserver`, so a normal
  # `docker compose up` does not start it.
  testserver:
    build: ./tests
    container_name: todo-testserver
    depends_on:
      - backend
    profiles:
      - test

volumes:
  mysql-data:
    driver: local