server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any path that isn't a real file falls back to index.html so
    # the client-side app can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend service on the compose network.
    # The browser sees a single origin, so there is no CORS in production.
    # Note: no trailing slash on proxy_pass, so the full /api/... path is kept
    # and reaches Flask's /api/todos routes unchanged.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
